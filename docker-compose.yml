services:
  db:
    image: postgres:15
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks: [internal]          # NOT published: private DB (port 5432 never exposed)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    # IMPORTANT: exactly ONE worker, price state + WebSocket hub live in this process's RAM
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    networks: [internal]
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports: ["443:443", "80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [backend]
    networks: [internal]
volumes:
  pgdata:
networks:
  internal:
